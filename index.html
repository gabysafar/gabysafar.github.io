<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive Links</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Luxury dark textured background with subtle overlay */
            background: linear-gradient(rgba(15, 15, 15, 0.85), rgba(20, 20, 20, 0.95)),
            url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            color: #f8fafc;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
            /* Premium dark glassmorphism */
            background: rgba(18, 18, 18, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.15); /* Subtle gold border tint */
            padding: 48px 24px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .profile-img {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            /* Gold border accent for the profile picture */
            border: 2px solid rgba(212, 175, 55, 0.6);
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 10px;
            /* Elegant light gold font color */
            color: #f3e5ab;
        }

        .description {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 40px;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .link-btn {
            display: block;
            width: 100%;
            padding: 18px;
            /* Deep matching background for buttons */
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 14px;
            color: #f8fafc;
            text-decoration: none;
            font-weight: 400;
            font-size: 0.95rem;
            letter-spacing: 0.8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Elegant gold hover reveal */
        .link-btn:hover {
            background: rgba(212, 175, 55, 0.08);
            color: #fff;
            transform: translateY(-3px);
            border-color: rgba(212, 175, 55, 0.7);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.05);
        }

        .link-btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Profile Picture Placeholder -->
    <img class="profile-img" src="./tVTpzUxf_400x400.jpg" alt="Profile Picture">

    <!-- Name & Description -->
    <h1>YOUR NAME</h1>
    <p class="description"> Goddess Decides </p>

    <!-- Links List -->
    <div class="links-wrapper">
        <a href="https://youpay.me/Worshipnicole" target="_blank" class="link-btn"> YouPay </a>
        <a href="https://youpay.me/Worshipnicole" target="_blank" class="link-btn"> Revolut </a>
        <a href="https://youpay.me/Worshipnicole" target="_blank" class="link-btn"> Apple Pay </a>
        <a href="https://x.com/iworshipnicole" target="_blank" class="link-btn"> Twitter </a>
        <a href="https://www.loyalfans.com/iworshipnicole" target="_blank" class="link-btn"> LoyalFans</a>
        <a href="https://throne.com/paynicole" target="_blank" class="link-btn"> Throne</a>
    </div>
</div>

</body>
</html>
