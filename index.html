<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive Links</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Light, smooth pastel pink gradient */
            background: linear-gradient(135deg, #fff0f5 0%, #ffdee9 40%, #b5fffc 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            color: #2c3e50; /* Darker font for readability over light background */
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
            /* Toned down bright white; changed to a translucent pink-tinted cream base for a better blend */
            background: rgba(255, 240, 245, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(212, 175, 55, 0.35); /* Softened gold border tint */
            padding: 48px 24px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(163, 112, 129, 0.1);
        }

        .profile-img {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            /* Gold border accent for the profile picture */
            border: 2px solid rgba(212, 175, 55, 0.7);
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 10px;
            /* Elegant deep rich gold/bronze for better text contrast */
            color: #a0740a;
        }

        .description {
            font-size: 0.9rem;
            color: #4a5568;
            margin-bottom: 40px;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .link-btn {
            display: block;
            width: 100%;
            padding: 18px;
            /* Buttons match the container blend style */
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 14px;
            color: #2c3e50;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Gold hover reveal optimized for light mode */
        .link-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            color: #a0740a;
            transform: translateY(-3px);
            border-color: rgba(212, 175, 55, 0.8);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.08);
        }

        .link-btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Profile Picture Placeholder -->
    <img class="profile-img" src="./tVTpzUxf_400x400.jpg" alt="Profile Picture">

    <!-- Name & Description -->
    <h1>Goddess Nicole</h1>
    <p class="description"> Your money is my money 🥂 </p>

    <!-- Links List -->
    <div class="links-wrapper">
        <a href="https://youpay.me/Worshipnicole" target="_blank" class="link-btn"> YouPay </a>
        <a href="https://revolut.me/1111prosperity" target="_blank" class="link-btn"> Revolut </a>
        <a href="https://revolut.me/1111prosperity" target="_blank" class="link-btn"> Apple Pay </a>
        <a href="https://x.com/iworshipnicole" target="_blank" class="link-btn"> Twitter </a>
        <a href="https://www.loyalfans.com/iworshipnicole" target="_blank" class="link-btn"> LoyalFans</a>
        <a href="https://throne.com/iworshipnicole" target="_blank" class="link-btn"> Throne</a>
    </div>
</div>

</body>
</html>
